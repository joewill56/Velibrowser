name: Build VeilBrowse Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore and Verify Permanent Debug Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VEILBROWSE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          # 1. Check that secrets.VEILBROWSE_DEBUG_KEYSTORE_BASE64 exists and is not empty
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::FATAL: Required GitHub Actions secret 'VEILBROWSE_DEBUG_KEYSTORE_BASE64' is missing or empty!"
            echo "::error::To fix this, go to: Repository Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "::error::Name: VEILBROWSE_DEBUG_KEYSTORE_BASE64"
            echo "::error::Value: Base64 encoding of the permanent VeilBrowse debug.keystore"
            exit 1
          fi

          # 2. Decode it to $GITHUB_WORKSPACE/debug.keystore (do not echo secret content)
          echo "${KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/debug.keystore"

          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ] || [ ! -s "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            echo "::error::FATAL: Failed to decode debug.keystore from secret VEILBROWSE_DEBUG_KEYSTORE_BASE64!"
            exit 1
          fi

          # 3. Verify that the resulting file is a valid Java keystore
          if ! keytool -list -keystore "${GITHUB_WORKSPACE}/debug.keystore" -storepass android >/dev/null 2>&1; then
            echo "::error::FATAL: Decoded debug.keystore is not a valid Java keystore or storepass is invalid!"
            exit 1
          fi

          # 4. Verify its certificate SHA-256 fingerprint
          KEYSTORE_SHA256=$(keytool -list -v -keystore "${GITHUB_WORKSPACE}/debug.keystore" -storepass android | grep -i "SHA256:" | head -n 1 | sed 's/.*SHA256: *//I' | tr -d ' \r\n')
          echo "Restored Keystore Certificate SHA-256: $KEYSTORE_SHA256"

          EXPECTED_SHA256="38:E2:FC:8D:A0:7A:11:5E:FF:05:F9:67:62:BD:D3:1C:CA:7A:4F:44:D3:F1:59:5B:16:05:D2:26:C9:00:4E:33"
          if [ "${KEYSTORE_SHA256^^}" != "${EXPECTED_SHA256^^}" ]; then
            echo "::error::FATAL: debug.keystore certificate fingerprint mismatch! Found: $KEYSTORE_SHA256, Expected: $EXPECTED_SHA256"
            exit 1
          fi

          echo "Permanent VeilBrowse debug keystore verified successfully."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Build and Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Signing Certificate and Schemes
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::FATAL: APK file not found after build!"
            exit 1
          fi
          echo "=== Inspecting APK: $APK_PATH ==="

          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN="apksigner"
          else
            SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            APKSIGNER_BIN=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "$APKSIGNER_BIN" ] || [ ! -f "$APKSIGNER_BIN" ]; then
            echo "::error::FATAL: apksigner binary not found in system or Android SDK build-tools!"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER_BIN"

          # 1. Print and capture complete non-secret apksigner verification report (stdout and stderr)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_PATH" > apk_signing_report.txt 2>&1 || true

          echo "==================== APKSIGNER VERIFICATION REPORT ===================="
          cat apk_signing_report.txt
          echo "======================================================================="

          # 2. Extract certificate SHA-256 fingerprint robustly across build-tools versions
          RAW_FINGERPRINT=$(python3 - << 'EOF'
          import re, sys
          try:
              with open("apk_signing_report.txt", "r", encoding="utf-8", errors="replace") as f:
                  content = f.read()

              # Priority 1: Match certificate line specifically (excluding public key)
              cert_lines = [
                  line for line in content.splitlines()
                  if "certificate" in line.lower() and "sha" in line.lower() and "256" in line.lower() and "public key" not in line.lower()
              ]
              for line in cert_lines:
                  m = re.search(r"([0-9a-fA-F:]{64,95})", line)
                  if m:
                      print(m.group(1).strip())
                      sys.exit(0)

              # Priority 2: Generic certificate SHA-256 pattern
              m = re.search(r"(?:certificate\s+)?SHA-?256(?:\s+digest)?\s*:?\s*([0-9a-fA-F:]{64,95})", content, re.IGNORECASE)
              if m:
                  print(m.group(1).strip())
                  sys.exit(0)

              sys.exit(1)
          except Exception:
              sys.exit(1)
          EOF
          ) || RAW_FINGERPRINT=""

          # Fallback to sed/awk/grep if python did not match
          if [ -z "$RAW_FINGERPRINT" ]; then
            RAW_FINGERPRINT=$(grep -i "certificate.*SHA.*256" apk_signing_report.txt 2>/dev/null | grep -vi "public key" | sed -E 's/.*([0-9a-fA-F:]{64,95}).*/\1/' | head -n 1) || RAW_FINGERPRINT=""
          fi

          # 3. Normalize extracted fingerprint: lowercase, remove colons, spaces, and newlines
          NORMALIZED_FINGERPRINT=$(echo "${RAW_FINGERPRINT}" | tr '[:upper:]' '[:lower:]' | tr -d ': \t\r\n')

          # 5 & 6. Verify extracted value is not empty
          if [ -z "$NORMALIZED_FINGERPRINT" ]; then
            echo "::error::FATAL: Could not extract certificate SHA-256 fingerprint from apksigner output!"
            echo "::error::The full apksigner verification report has been printed above for diagnosis."
            exit 1
          fi

          EXPECTED_FINGERPRINT="38e2fc8da07a115eff05f96762bdd31cca7a4f44d3f1595b1605d226c9004e33"

          echo "Extracted APK Certificate SHA-256: $NORMALIZED_FINGERPRINT"
          echo "Expected APK Certificate SHA-256:  $EXPECTED_FINGERPRINT"

          # 4. Compare against expected permanent certificate
          if [ "$NORMALIZED_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::FATAL: APK was signed with an unexpected certificate ($NORMALIZED_FINGERPRINT)! Expected: $EXPECTED_FINGERPRINT"
            exit 1
          fi

          # 7. Verify V2 signing remains true
          if ! grep -qi "Verified using v2 scheme.*true" apk_signing_report.txt; then
            echo "::error::FATAL: APK is missing V2 signature scheme!"
            exit 1
          fi

          echo "Permanent APK signing identity (SHA-256: $EXPECTED_FINGERPRINT) and V2 scheme verified successfully."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veilbrowse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
